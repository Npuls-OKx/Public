name: Validatie

# Draait de controles die de repository zelf definieert, op elke pull request en op
# elke push naar dev. De scripts geven exitcode 1 bij een probleem; zie scripts/README.md.
#
# De bouwcontrole hoort hier bewust bij: zo blijkt op de pull request al of het
# releasepakket nog te bouwen is, in plaats van pas bij het maken van een release. Elk
# pakket in het repository gaat door die controle.

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validatie-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventies:
    name: Verwijzingen en conventies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dode links, ontsnappingen en dode anchors
        run: python3 scripts/check-links.py

      - name: Issueverwijzingen, metadatakoppen, branchlinks, inleidingen
        run: python3 scripts/check-conventies.py

      - name: Drift tussen JSON, schema en gegenereerde bomen
        run: |
          shopt -s globstar nullglob
          python3 scripts/json-tree.py --check **/*.md

      - name: Requirementsboom-navigatie en terugleiding
        run: python3 scripts/validate-requirementsboom-navigatie.py

      - name: Testgevallen van de controlescripts
        run: python3 -m unittest discover -s tests

  bouw:
    name: Releasepakketten bouwbaar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pandoc installeren
        uses: ./.github/actions/pandoc

      - name: Elk pakket bouwen zonder artefacten achter te laten
        # Een pakket is een map met een release.json; ze worden opgezocht in plaats van
        # opgesomd, zodat een nieuw pakket hier geen wijziging vraagt.
        run: |
          set -euo pipefail
          find . -mindepth 2 -maxdepth 2 -name release.json -printf '%h\n' \
            | sed 's|^\./||' | sort | while read -r pakket; do
              echo "::group::${pakket}"
              python3 scripts/build-release.py "$pakket" --alleen-controle
              echo "::endgroup::"
            done
